name: Update RSS Feed

on:
  schedule:
    # 毎週金曜日 14:00 (中国時間 = UTC+8) → UTC 6:00
    - cron: '0 6 * * 5'
  workflow_dispatch:  # 手動実行も可能

# 権限を明示的に設定（重要！）
permissions:
  contents: write  # リポジトリの内容を書き込む権限

jobs:
  update-rss:
    runs-on: ubuntu-latest
    
    # ジョブレベルでも権限を設定可能
    permissions:
      contents: write
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 履歴を全て取得（必要に応じて）
          fetch-depth: 0
      
      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: RSSフィードを生成
        run: python rss_generator.py
      
      - name: 変更をコミットしてプッシュ
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add rss.xml
          # 変更がある場合のみコミット
          if git diff --staged --quiet; then
            echo "変更はありません"
          else
            git commit -m "chore: RSSフィードを自動更新 ($(date '+%Y-%m-%d %H:%M'))"
            git push
          fi
